<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/shogoochiai0421/YourEmo/main/favicon.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>きもちチェック</title>
</head>
<body>
<style>
@import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic&display=swap');

/* =====================================================
   ★ デザイン設定まとめ ★
   ===================================================== */

:root {
  --fade-ms:             500;
  --fade-wait-ms:        200;
  --bubble-feed-ms:     300;
  --res-ttl-size:        40px;
  --center-img-size:    220px;
  --center-txt-size:     30px;
  --act-ttl-size:        28px;
  --act-desc-size:       16px;
  --bubble-w:           255px;
  --bubble-txt:          16px;
  --bubble-img-size:    150px;
  --bubble-gap:          20px;
  --detail-img-size:    280px;
  --detail-ttl-size:     30px;
  --detail-desc-size:    22px;
  --fw-q-text:           700;
  --fw-opt-label:        700;
  --fw-res-ttl:          700;
  --fw-res-desc:         700;
  --fw-bubble:           700;
}

*{box-sizing:border-box;margin:0;padding:0}

html, body {
  width:100%;
  height:100dvh;
  overflow:hidden;
  background-color: rgb(255, 250, 241);
}

#app {
  font-family:'M PLUS Rounded 1c',sans-serif;
  font-weight:700;
  width:100%;
  height:100dvh;
  display:flex; flex-direction:column;
  color:#53433a;
  overflow:hidden;
  position:relative;
}

.header-text {
  position:absolute; bottom:20px; right:40px;
  font-size:18px; color:#7e7d81;
  z-index:100; pointer-events:none;
  font-family:'Zen Maru Gothic',sans-serif;
}

.footer-text {
  position:absolute; bottom:20px; left:30px;
  font-size:16px; color:#7e7d81;
  z-index:100; pointer-events:none;
  font-family:'Zen Maru Gothic',sans-serif;
}

/* ── 画面共通：フェード ── */
.screen {
  display:none; width:100%; height:100%;
  flex-direction:column; align-items:center; justify-content:center;
  padding:20px;
  opacity:0;
  transition:opacity calc(var(--fade-ms) * 1ms) ease;
  overflow-y:auto;
  overflow-x:hidden;
}
.screen.active  { display:flex; }
.screen.visible { opacity:1; }

/* ── スタート画面 ── */
#startScreen {
  justify-content: flex-start;
  padding-top: clamp(24px, 12vh, 115px);
}
.big-img {width:clamp(90px, 22vh, 250px); height:clamp(90px, 22vh, 250px); object-fit:contain; margin-bottom:10px; display:block;}
.ttl { font-size:clamp(22px, 5.5vh, 35px); color:var(--color-text-secondary); text-align:center; line-height:1.2; margin-bottom:clamp(12px, 3vh, 30px); }
.sub { font-size:clamp(14px, 3.2vh, 25px); color:var(--color-text-secondary); text-align:center; line-height:1.2; margin-bottom:clamp(14px, 3vh, 30px);   font-family:'Zen Maru Gothic',sans-serif;}
.start-btn { background:#ffce65; color:#fff; border:none; border-radius:99px; padding:clamp(14px, 3.5vh, 30px) clamp(28px, 7vw, 50px); font-size:clamp(16px, 3.5vh, 30px); font-weight:500; cursor:pointer; }
.start-btn:active { transform:scale(0.96); }

/* ── 質問画面 ── */
#quizScreen {
  justify-content: flex-start;
  padding-top: clamp(16px, 6vh, 60px);
}
.pbar-wrap { width:100%; height:7px; background:var(--color-background-secondary); border-radius:99px; margin-bottom:16px; overflow:hidden; flex-shrink:0; }
.pbar { height:100%; border-radius:99px; background:#FFA726; transition:width .35s; }
.q-text { font-size:clamp(18px, 5.5vh, 40px); font-weight:var(--fw-q-text); color:var(--color-text-primary); text-align:center; line-height:1.4; margin-bottom:clamp(8px, 2vh, 16px); flex-shrink:0; }
.opts { --opt-gap:clamp(8px, 2vw, 15px); display:grid; grid-template-columns:1fr 1fr; gap:var(--opt-gap); width:100%; max-width:600px; flex-shrink:0; margin: 0 auto; }
.opts .opt:nth-child(odd):last-child { grid-column:1 / -1; justify-self:center; width:calc((100% - var(--opt-gap)) / 2); }
.opts.opts-5 .opt .oi img { width:clamp(48px, 11vh, 100px); height:clamp(48px, 11vh, 100px); }
.opt  { background:#FFF3E0; border:1.5px solid #FFCC80; border-radius:16px; padding:clamp(8px, 2vh, 11px) clamp(12px, 6vw, 50px); font-size:clamp(13px, 2.8vh, 20px); cursor:pointer; color:var(--color-text-primary); display:flex; flex-direction:column; align-items:center; gap:5px; transition:background .12s,border-color .12s; -webkit-tap-highlight-color:transparent; }
.opt .oi     { font-size:10px; line-height:1; min-height:clamp(30px, 8vh, 50px); display:flex; align-items:center; justify-content:center; }
.opt .oi img { width:clamp(64px, 15vh, 130px); height:clamp(64px, 15vh, 130px); object-fit:contain; }
.opt .ol     { font-weight:var(--fw-opt-label); }
@media (hover:hover) and (pointer:fine) {
  .opt:hover  { background:#FFE0B2; border-color:#FFA726; }
}
.opt.sel    { background:#FFE0B2; border-color:#FFA726; color:#72243E; }
.opt:active { transform:scale(0.95); }

/* ── もどるボタン ── */
.back-btn { align-self:center; margin-top:12px; background:transparent; border:none; font-size:18px; color:#bbbbbb; cursor:pointer; padding:4px 8px; flex-shrink:0; }
@media (hover:hover) and (pointer:fine) {
  .back-btn:hover { color:#888; }
}
.back-btn:active { transform:scale(0.95); }
.back-btn.hidden { visibility:hidden; pointer-events:none; }

/* ── 結果画面 ── */
#resultScreen {
  padding:0; justify-content:flex-start; 
  padding-top: 20px;
}
.res-top  { text-align:center; padding:8px 16px 4px; flex-shrink:0; width:100%; }
.res-img  { width:var(--res-img-size); height:var(--res-img-size); object-fit:contain; margin:0 auto 3px; display:block;}
.res-ttl  { font-size:clamp(18px, 4.5vh, var(--res-ttl-size)); font-weight:var(--fw-res-ttl); color:var(--color-text-primary); line-height:1.3; }

/* ── 今の気持ち画面 ── */
.center-card     { background:var(--color-background-primary); border:1px solid var(--color-border-secondary); border-radius:24px; padding:10px 20px; text-align:center; width:auto; min-width:120px; }
.center-card .ce { line-height:1; margin-bottom:4px; min-height:50px; display:flex; align-items:center; justify-content:center; }
.center-card .ce img { width:var(--center-img-size); height:var(--center-img-size); object-fit:contain; }
.ct-tags-row { display:flex; flex-wrap:wrap; align-items:baseline; justify-content:center; margin-top:8px; }
.center-card .ct { font-size:14px; font-weight:700; color:var(--color-text-secondary); line-height:1.4; white-space:nowrap; }
.center-card .ct:not(:empty)::after { content:"・"; color:#888; font-weight:400; }
.sub-tags { display:inline; }
.sub-tag  { font-size:14px; color:#888; line-height:1.4; white-space:nowrap; }

/* ── 特効薬画面 ── */
#actScreen { padding:clamp(8px,1.5vh,16px) 16px clamp(4px,1vh,8px); justify-content:flex-start; }
.act-top  { text-align:center; padding:clamp(8px,2vh,30px) 0 clamp(4px,1vh,10px); flex-shrink:0; width:100%; }
.act-ttl  { font-size:clamp(14px, 3vh, var(--act-ttl-size));  font-weight:var(--fw-res-ttl);  color:var(--color-text-primary); }
.act-desc { font-size:clamp(10px, 1.8vh, var(--act-desc-size)); font-weight:var(--fw-res-desc); color:var(--color-text-secondary); margin-top:4px; line-height:1.5; }

.bubble-grid {
  display:grid;
  grid-template-columns: repeat(5, min(var(--bubble-w), 18vw));
  gap:clamp(6px, 1vw, var(--bubble-gap));
  justify-content:center;
  align-content:center;
  width:100%;
  flex:1;
  padding:0 8px;
}
@media (max-width: 480px) {
  .bubble-grid {
    grid-template-columns: repeat(2, min(var(--bubble-w), 44vw));
    gap:clamp(6px, 2vw, var(--bubble-gap));
  }
}

.bubble { width:100%; border-radius:20px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; font-size:clamp(10px, 1.2vw, var(--bubble-txt)); font-weight:var(--fw-bubble); line-height:1.4; padding:clamp(6px,1vh,10px) 8px; opacity:0; transition:opacity 0.6s ease; gap:4px; }
@media (max-width:480px) { .bubble { font-size:clamp(10px, 3vw, var(--bubble-txt)); } }
.bubble-img { width:min(var(--bubble-img-size), 13vw); height:min(var(--bubble-img-size), 13vw); object-fit:contain; flex-shrink:0; }
@media (max-width:480px) { .bubble-img { width:min(var(--bubble-img-size), 35vw); height:min(var(--bubble-img-size), 35vw); } }
.bubble-txt { line-height:1.4; }

@keyframes bubbleTapHint {
  0%    { transform:scale(1);    }
  10.5% { transform:scale(1.07); }
  89.5% { transform:scale(1.07); }
  100%  { transform:scale(1);    }
}
.bubble.hint-pulse {
  animation: bubbleTapHint 2.5s ease-in-out;
}

.retry-btn { flex-shrink:0; margin:8px 0 12px; background:var(--color-background-secondary); border:0.5px solid var(--color-border-secondary); border-radius:99px; padding:7px 22px; font-size:18px; color:var(--color-text-secondary); cursor:pointer; }
.next-screen-btn { flex-shrink:0; margin:12px 0 0; background:#ffce65; color:#fff; border:none; border-radius:99px; padding:14px 32px; font-size:22px; font-weight:700; cursor:pointer; }
.next-screen-btn:active { transform:scale(0.96); }

/* ── 特効薬詳細画面 ── */
#detailScreen {
  justify-content:center; align-items:center;
  padding:16px; gap:16px;
  background:transparent;
}

.detail-card {
  width:min(400px, 88vw);
  border-radius:20px;
  overflow:hidden;
  box-shadow: 0 8px 16px rgba(0,0,0,0.18), 0 2px 4px rgba(0,0,0,0.10);
  display:flex; flex-direction:column;
  flex-shrink:0;
  border: 3px solid rgba(255,255,255,0.55);
}

.detail-card-header {
  padding:clamp(16px, 4vh, 32px) 18px 5px;
  background: var(--detail-bg, #FBEAF0);
}
.detail-card-ttl {
  font-size:clamp(18px, 4vh, var(--detail-ttl-size));
  font-weight:700;
  color: var(--detail-tc, #72243E);
  text-align:center;
  line-height:1.3;
}

.detail-card-img-wrap {
  background: var(--detail-bg, #FBEAF0);
  display:flex; justify-content:center; align-items:flex-end;
  padding:clamp(12px, 3vh, 24px) 0 0;
  overflow:hidden;
  min-height:calc(clamp(120px, 28vh, var(--detail-img-size)) + 16px);
}
.detail-img {
  width:clamp(120px, 28vh, var(--detail-img-size));
  height:clamp(120px, 28vh, var(--detail-img-size));
  object-fit:contain;
  transform-origin: 50% 80%;
  animation: detailSway 5s ease-in-out infinite;
}
@keyframes detailSway {
  0%   { transform: rotate(0deg); }
  5%   { transform: rotate(3deg); }
  15%  { transform: rotate(-4deg); }
  25%  { transform: rotate(3deg); }
  40%  { transform: rotate(-1deg); }
  55%  { transform: rotate(0deg); }
  100% { transform: rotate(0deg); }
}

.detail-card-body {
  background:#fff;
  padding:10px 22px 30px;
}
.detail-card-desc {
  font-size:var(--detail-desc-size);
  color:#53433a;
  text-align:center;
  line-height:1.8;
}

.detail-back-btn {
  background:rgba(255,255,255,0.75);
  border:1.5px solid rgba(0,0,0,0.12);
  border-radius:99px;
  padding:10px 28px;
  font-size:17px;
  font-family:'M PLUS Rounded 1c',sans-serif;
  font-weight:700;
  color:#53433a;
  cursor:pointer;
  flex-shrink:0;
}
.detail-back-btn:active { transform:scale(0.96); }

.detail-card-body {
  position: relative;
}
.like-btn {
  position:absolute;
  bottom:10px; right:10px;
  background:transparent;
  border:none;
  cursor:pointer;
  padding:4px;
  line-height:1;
}
.like-btn:active { transform:scale(0.88); }
.like-img {
  width:var(--like-img-size, 44px);
  height:var(--like-img-size, 44px);
  object-fit:contain;
  transition:transform 0.15s ease;
}
.like-btn.liked .like-img { transform:scale(1.15); }

/* ── スマホ向け設定 ── */
@media (max-width: 480px) {
  :root {
    --center-img-size:  120px;
    --center-txt-size:  18px;
    --act-ttl-size:     20px;
    --act-desc-size:    12px;
    --bubble-w:        140px;
    --bubble-txt:       12px;
    --bubble-img-size:  80px;
    --bubble-gap:        8px;
    --detail-img-size: 200px;
    --detail-ttl-size:  25px;
    --detail-desc-size: 18px;
  }

  #startScreen { padding-top: 60px; }
  .big-img     { width: 150px; height: 150px; }
  .ttl         { font-size: 32px; margin-bottom: 16px; }
  .sub         { font-size: 18px; margin-bottom: 30px; }
  .start-btn   { font-size: 18px; padding: 20px 36px; }
  .footer-text { font-size: 10px; bottom: 10px; left: 8px; }
  .header-text { font-size: 4px; bottom: 12px; right: 16px; }

  #quizScreen  { padding-top:20px; }
  .q-text      { font-size: 28px; margin-bottom: 10px; }
  .opts        { --opt-gap: 10px; max-width: 100%; }
  .opt         { padding: 8px 12px; font-size: 14px; }
  .opt .oi img { width: 110px; height: 110px; }
  .opts.opts-5 .opt .oi img { width: 84px; height: 84px; }
  .back-btn    { font-size: 10px; }

  #resultScreen    { padding-top: 5px; }
  .res-ttl         { font-size: 20px; }
  .center-card .ct { font-size: 15px; }
  .sub-tags        { font-size: 10px; }
  .retry-btn       { font-size: 10px; margin-bottom: 16px; }
  .next-screen-btn { font-size: 16px; padding: 12px 24px; }
}

/* ── 名前選択UI ── */
.name-pick-row {
  display:flex; align-items:center; gap:10px;
  margin-bottom:18px;
}
.name-select {
  font-family:'M PLUS Rounded 1c',sans-serif;
  font-weight:700;
  font-size:20px;
  color:#53433a;
  background:#fff;
  border:1.5px solid #FFCC80;
  border-radius:99px;
  padding:11px 25px;
  cursor:pointer;
  max-width:290px;
  outline:none;
}
.name-add-btn {
  width:52px; height:52px;
  background:#ffce65;
  color:#fff;
  border:none;
  border-radius:50%;
  font-size:32px;
  font-weight:700;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
  line-height:1;
}
.name-add-btn:active { transform:scale(0.92); }

.start-btn:disabled {
  background:#d8d0c8;
  color:#fff;
  cursor:not-allowed;
}
.start-btn:disabled:active { transform:none; }

.name-icon {
  display:inline-block;
  width:1.2em; height:1.2em;
  object-fit:contain;
  vertical-align:-0.22em;
  margin-right:0.2em;
}

.name-dd { position:relative; font-size:20px; }
.name-dd-btn {
  display:flex; align-items:center; gap:8px; text-align:left;
}
.name-dd-label { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.name-dd-caret { font-size:0.8em; color:#b09070; flex-shrink:0; }
.name-dd-menu {
  display:none;
  position:absolute; left:0; top:calc(100% + 6px);
  min-width:100%; max-height:min(40vh, 320px);
  overflow-y:auto;
  background:#fff;
  border:1.5px solid #FFCC80; border-radius:16px;
  box-shadow:0 6px 16px rgba(0,0,0,0.15);
  padding:6px; z-index:300;
  flex-direction:column;
}
.name-dd-menu.open { display:flex; }
.name-dd-opt {
  font-family:'M PLUS Rounded 1c',sans-serif; font-weight:700;
  font-size:inherit; color:#53433a;
  background:none; border:none; border-radius:10px;
  padding:10px 16px; text-align:left; white-space:nowrap;
  cursor:pointer; width:100%;
}
.name-dd-opt:active { background:#FFF3E0; }

@media (max-width: 480px) {
  .name-pick-row { gap: 6px; margin-bottom: 14px; }
  .name-select   { font-size: 15px; padding: 9px 18px; max-width: 70vw; }
  .name-add-btn  { width: 42px; height: 42px; font-size: 26px; }
  .name-dd       { font-size: 15px; }
}

/* ── 元気度メーター画面 ── */
#gaugeScreen {
  justify-content: flex-start;
  padding-top: clamp(16px, 6vh, 60px);
  padding-bottom: 40px;
}
.gauge-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  flex-shrink: 0;
  position: relative;
  width: 100%;
  max-width: 420px;
}

.gauge-drag-wrapper {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  touch-action: none;
}

.gauge-label-top {
  font-size: 14px;
  color: #53433a;
  margin-bottom: 4px;
  font-weight: 700;
}

.gauge-track-wrap {
  position: relative;
  width: 120px;
  height: clamp(200px, 42vh, 340px);
  display: flex;
  justify-content: center;
  margin: 4px 0;
}

.gauge-track {
  width: 100%;
  height: 100%;
  border: 3px solid #53433a;
  border-radius: 10px;
  position: relative;
  background: #fff;
  overflow: hidden;
  z-index: 1;
}

.gauge-track::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 10;
  background-image: 
    linear-gradient(to right, #53433a 0, #53433a 24px, transparent 24px),
    linear-gradient(to right, #53433a 0, #53433a 24px, transparent 24px),
    linear-gradient(to right, #53433a 0, #53433a 24px, transparent 24px),
    repeating-linear-gradient(to bottom, transparent 0%, transparent calc(5% - 1px), #999 calc(5% - 1px), #999 5%);
  background-size: 100% 3px, 100% 3px, 100% 3px, 14px 100%;
  background-position: 0 25%, 0 50%, 0 75%, left 4px center;
  background-repeat: no-repeat;
}

.gauge-fill {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 0%;
  pointer-events: none;
  z-index: 2;
}

.gauge-fill::before {
  content: "";
  position: absolute;
  top: -8px;
  left: 0;
  width: 200%;
  height: 10px;
  background-color: inherit;
  clip-path: polygon(
    0% 100%, 5% 60%, 10% 30%, 15% 10%, 20% 0%, 
    25% 10%, 30% 30%, 35% 60%, 40% 100%, 
    45% 60%, 50% 30%, 55% 10%, 60% 0%, 
    65% 10%, 70% 30%, 75% 60%, 80% 100%, 
    85% 60%, 90% 30%, 95% 10%, 100% 0%,
    100% 100%
  );
  animation: wave 5s linear infinite;
  pointer-events: none;
}

@keyframes wave {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

.gauge-thumb {
  position: absolute;
  right: -240px;
  width: 240px; 
  height: 170px;
  transform: translateY(50%);
  z-index: 10;
  user-select: none;
  -webkit-user-drag: none;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  pointer-events: none;
}

.gauge-thumb-bg {
  width: 170px;
  height: 170px;
  background: #FFF3E0;
  border: 3px solid #FFCC80;
  border-radius: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  pointer-events: none;
}
.gauge-thumb img.face-img {
  width: 150px;
  height: 150px;
  object-fit: contain;
  pointer-events: none;
}
.gauge-arrow {
  width: 0;
  height: 0;
  border-top: 24px solid transparent;
  border-bottom: 24px solid transparent;
  border-right: 30px solid #53433a;
  margin-right: 8px;
  flex-shrink: 0;
  pointer-events: none;
}

.gauge-label-bottom {
  font-size: 14px;
  color: #53433a;
  margin-top: 4px;
  font-weight: 700;
}

.gauge-drag-area {
  position: absolute;
  top: 0;
  bottom: 0;
  left: -50px;
  right: -280px;
  z-index: 5;
  cursor: grab;
}
.gauge-drag-area:active { cursor: grabbing; }

.gauge-fixed-face {
  width: 60px;
  height: 60px;
  object-fit: contain;
  pointer-events: none;
}

/* ── 「いまどこにいたい？」画面用CSS ── */
#locationScreen {
  justify-content: flex-start;
  padding-top: clamp(16px, 6vh, 60px);
  padding-bottom: 20px;
}

.q-header {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin-bottom: clamp(8px, 2vh, 16px);
  flex-wrap: wrap;
}

.not-here-btn {
  background: #fff;
  color: #888;

<script>
/* 画像ベースURLの定義 */
const BASE_EXP  = "https://raw.githubusercontent.com/shogoochiai0421/YourEmo/main/images/expressions/";

const likedSet = new Set();

const LIKE_IMG_OFF = BASE_ACT + "like-off.png";
const LIKE_IMG_ON  = BASE_ACT + "like-on.png";

const IMG = {
  rainbow:        BASE_EXP+"main-rainbow.png",
  smile:          BASE_EXP+"expression-smile.png",
  cry:            BASE_EXP+"expression-cry.png",
  mad:            BASE_EXP+"expression-mad.png",
  puzzled:        BASE_EXP+"expression-puzzled.png",
  sad:            BASE_EXP+"expression-sad.png",
  normal:         BASE_EXP+"expression-normal.png",
  amaze:          BASE_EXP+"expression-amaze.png",
  kidding:        BASE_EXP+"expression-kidding.png",
  wink:           BASE_EXP+"expression-wink.png",
  enjoy:          BASE_EXP+"expression-enjoy.png",
  expressionless: BASE_EXP+"expression-expressionless.png",
  fear:           BASE_EXP+"expression-fear.png",
  notfeelingwell: BASE_EXP+"expression-notfeelingwell.png",
  panic:          BASE_EXP+"expression-panic.png",
  sickness:       BASE_EXP+"expression-sickness.png",
  sleepy:         BASE_EXP+"expression-sleepy.png",
  tired:          BASE_EXP+"expression-tired.png",
  playwith:       BASE_EXP+"expression-playwith.png",
  alone:          BASE_EXP+"expression-alone.png",
  palpitations:   BASE_EXP+"expression-palpitations.png",
  stuffy:         BASE_EXP+"expression-stuffy.png",
  talk:          BASE_EXP+"expression-talking.png",
  happy:          BASE_EXP+"expression-happy.png",
};

/* メーター用の画像（1.png=元気 〜 16.png=最悪） */
const GAUGE_IMAGES = [];
for(let i=1; i<=16; i++){
  GAUGE_IMAGES.push(BASE_IMG + "gauge/" + i + ".png");
}

const Qs=[
  {id:"mood",text:"いまの きもちは どれかな？",opts:[
    {ikey:"smile",          l:"たのしいきもち",       v:"happy"},
    {ikey:"cry",            l:"かなしいきもち",       v:"sad"},
    {ikey:"mad",            l:"いらいらする",         v:"angry"},
    {ikey:"fear",           l:"なんだかこわいきもち", v:"anxious"},
    {ikey:"normal",         l:"ふつう",           v:"normal"}
  ]},
  {id:"gauge",text:"いまのげんきさをおしえてね",opts:[]},
  {id:"location",text:"いまどこにいたい？",opts:[]}, // 以前の social の位置
  {id:"body",text:"からだは どんなかんじ？",opts:[
    {ikey:"happy",          l:"げんき",               v:"fine"},
    {ikey:"palpitations",   l:"ドキドキしてる",       v:"heart"},
    {ikey:"stuffy",         l:"いきぐるしい",         v:"breath"},
    {ikey:"sickness",       l:"きもちわるい<br>あたまがいたい", v:"bad"},
    {ikey:"normal",         l:"ふつうかな",           v:"normal"}
  ]},
  {id:"wish",text:"いま したいことは？",opts:[
    {ikey:"playwith",       l:"あそびたい",           v:"play"},
    {ikey:"sleepy",         l:"ねむりたい",           v:"sleep"},
    {ikey:"talk",           l:"はなしたいことが<br>ある",  v:"talk"},
    {ikey:"expressionless", l:"したいことはない",     v:"nothing"}
  ]}
];

function matchTag(tag, val){
  if(!tag || tag === "any") return false;
  if(Array.isArray(tag)) return tag.includes(val);
  return tag === val;
}
function scoreBubble(bubble, ans){
  let score = 0;
  const tags = bubble.tags;
  if(matchTag(tags.mood,   ans.mood))   score++;
  if(matchTag(tags.body,   ans.body))   score++;
  if(matchTag(tags.wish,   ans.wish))   score++;
  return score;
}

function selectBubbles(ans, n){
  const scored = BUBBLES.map(b => {
    const s = scoreBubble(b, ans);
    return {b, s, w: Math.pow(2, s)};
  });

  let candidates = scored.filter(x => x.s >= 1);

  if(candidates.length < n){
    const zeros = scored.filter(x => x.s === 0);
    candidates = candidates.concat(zeros.slice(0, n - candidates.length));
  }

  const result = [];
  const used = new Set();
  for(let i = 0; i < n && used.size < candidates.length; i++){
    const total = candidates.reduce((s, x, idx) => used.has(idx) ? s : s + x.w, 0);
    let r = Math.random() * total;
    for(let j = 0; j < candidates.length; j++){
      if(used.has(j)) continue;
      r -= candidates[j].w;
      if(r <= 0){ used.add(j); result.push(candidates[j].b); break; }
    }
  }
  return result;
}

function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function cssVar(name){return parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name))||0;}

let cur=0,ans={},busy=false,chosenBubbles=[];
let gaugeValue = 7;
let isDraggingGauge = false;

function fadeIn(el){
  el.classList.add("active");
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add("visible")));
}
function fadeOut(el,cb){
  el.classList.remove("visible");
  setTimeout(()=>{el.classList.remove("active");if(cb)cb();},cssVar('--fade-ms')||300);
}
function fadeContent(cb){
  const qs=document.getElementById("quizScreen");
  const ms=(cssVar('--fade-ms')||300)*0.6;
  qs.style.transition=`opacity ${ms}ms ease`;
  qs.style.opacity="0";
  setTimeout(()=>{cb();qs.style.opacity="1";setTimeout(()=>{qs.style.transition="";},ms+50);},ms);
}

const NAME_RESULT_URL = "https://script.google.com/macros/s/XXXXXXXXXX/exec";

function toggleNameDd(e){
  if(e) e.stopPropagation();
  document.getElementById("nameDdMenu").classList.toggle("open");
}
function closeNameDd(){
  const m = document.getElementById("nameDdMenu");
  if(m) m.classList.remove("open");
}
document.addEventListener("click", closeNameDd);
function renderNameDd(){
  const menu = document.getElementById("nameDdMenu");
  if(!menu) return;
  menu.innerHTML = "";
  const mk = (id, html) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "name-dd-opt";
    b.innerHTML = html;
    b.onclick = () => pickNameDd(id);
    menu.appendChild(b);
  };
  mk("", "なまえを えらぶ");
  loadNames().forEach(n => mk(n.id, nameHtml(n)));
}
function pickNameDd(id){
  const sel = document.getElementById("nameSelect");
  sel.value = id;
  closeNameDd();
  onNameSelect();
}
function updateNameDdLabel(){
  const lab = document.getElementById("nameDdLabel");
  if(!lab) return;
  const u = getSelectedUser();
  lab.innerHTML = u ? nameHtml(u) : "なまえを えらぶ";
}

function refreshNameSelect(){
  const list = loadNames();
  const sel = document.getElementById("nameSelect");
  const savedId = sel.value || sessionStorage.getItem("kimochi_selected_id") || "";
  sel.innerHTML = '<option value="">なまえを えらぶ</option>';
  list.forEach(n => {
    const opt = document.createElement("option");
    opt.value = n.id;
    opt.textContent = n.name;
    if(n.id === savedId) opt.selected = true;
    sel.appendChild(opt);
  });
  renderNameDd();
  updateStartBtn();
}

function onNameSelect(){
  updateStartBtn();
  const sel = document.getElementById("nameSelect");
  if(sel && sel.value) sessionStorage.setItem("kimochi_selected_id", sel.value);
  else sessionStorage.removeItem("kimochi_selected_id");
}
function updateStartBtn(){
  const sel = document.getElementById("nameSelect");
  const btn = document.getElementById("startBtn");
  if(!sel || !btn) return;
  const selOpt = sel.options[sel.selectedIndex];
  const selUser = getSelectedUser();
  if(sel.value && selOpt && selUser){
    btn.innerHTML = nameHtml(selUser) + "さんとして はじめる";
    btn.disabled = false;
  } else {
    btn.textContent = "はじめる";
    btn.disabled = true;
  }
  updateNameDdLabel();
}

function getSelectedUser(){
  const sel = document.getElementById("nameSelect");
  if(!sel || !sel.value) return null;
  const list = loadNames();
  return list.find(n => n.id === sel.value) || null;
}

function goNameScreen(){
  fadeOut(document.getElementById("startScreen"),()=>{ location.href = "names.html"; });
}

function sendResult(){
  const user = getSelectedUser();
  if(!user) return;
  const params = new URLSearchParams();
  params.append("name", user.name);
  params.append("uid",  user.id);
  const url = NAME_RESULT_URL + "?" + params.toString();
  if(navigator.sendBeacon){ navigator.sendBeacon(url); }
  else if(window.fetch){ fetch(url,{mode:"no-cors"}).catch(()=>{}); }
  else { new Image().src = url; }
}

window.addEventListener("load",()=>{
  const si=document.getElementById("startImg");
  if(IMG.rainbow){si.src=IMG.rainbow;si.style.display="block";}else{si.style.display="none";}
  refreshNameSelect();
  fadeIn(document.getElementById("startScreen"));
});

window.addEventListener("pageshow",(e)=>{
  if(!e.persisted) return;
  refreshNameSelect();
  const s=document.getElementById("startScreen");
  if(!s.classList.contains("active")) fadeIn(s);
});

function startQ(){
  if(!getSelectedUser()) return;

  fadeOut(document.getElementById("startScreen"),()=>{
    const user = getSelectedUser();
    const badge = document.getElementById("quizNameBadge");
    if(user){
      badge.innerHTML = nameHtml(user) + "さん";
      badge.style.display = "block";
    } else {
      badge.style.display = "none";
    }
    cur=0;ans={};renderQ();
    fadeIn(document.getElementById("quizScreen"));
  });
}

function renderQ(){
  busy=false;
  const q=Qs[cur];
  const qId=q.id;

  if(qId === "gauge"){
    initGaugeScreen();
    return; 
  }
  
  if(qId === "location"){
    initLocationScreen();
    return;
  }

  document.getElementById("pbar").style.width=(cur/Qs.length*100)+"%";
  document.getElementById("qtext").textContent=q.text;
  const backBtn=document.getElementById("backBtn");
  if(cur===0){ backBtn.classList.add("hidden"); }else{ backBtn.classList.remove("hidden"); }
  const topBtn=document.getElementById("topBtn");
  if(cur===0){ topBtn.classList.remove("hidden"); }else{ topBtn.classList.add("hidden"); }
  const g=document.getElementById("opts");
  g.innerHTML="";
  g.classList.toggle("opts-5", q.opts.length===5);
  g.style.pointerEvents="auto";
  q.opts.forEach(o=>{
    const b=document.createElement("button");
    b.className="opt";
    const src=IMG[o.ikey];
    b.innerHTML=`<span class="oi">${src?`<img src="${src}" alt="">`:""}</span><span class="ol">${o.l}</span>`;
    b.onclick=()=>selectOpt(qId,o.v,b,g);
    g.appendChild(b);
  });
}

function goBack(){
  if(cur<=0 || busy) return;
  busy = true;

  const currentQ = Qs[cur].id;
  const prevQ = Qs[cur-1].id;

  if (currentQ === "gauge") {
    delete ans["gauge"];
    cur--;
    fadeOut(document.getElementById("gaugeScreen"), () => {
      renderQ();
      fadeIn(document.getElementById("quizScreen"));
    });
  } else if (currentQ === "location") {
    delete ans["location"];
    cur--;
    if (prevQ === "gauge") {
      fadeOut(document.getElementById("locationScreen"), () => {
        initGaugeScreen();
        fadeIn(document.getElementById("gaugeScreen"));
      });
    }
  } else if (currentQ === "body") {
    delete ans["body"];
    cur--;
    if (prevQ === "location") {
      fadeOut(document.getElementById("quizScreen"), () => {
        initLocationScreen();
        fadeIn(document.getElementById("locationScreen"));
      });
    }
  } else if (currentQ === "wish") {
    delete ans["wish"];
    cur--;
    fadeContent(()=>renderQ());
  } else {
    busy = false;
  }
}

function goTop(){
  if(busy) return;
  busy = true;
  const activeScreen = document.querySelector(".screen.active.visible");
  if (activeScreen) {
    fadeOut(activeScreen, () => {
      cur=0;ans={};
      fadeIn(document.getElementById("startScreen"));
      busy = false;
    });

  busy = false;

    };

function handleGaugeMove(e){
  const trackWrap = document.getElementById("gaugeTrackWrap");
  const rect = trackWrap.getBoundingClientRect();
  
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  let relativeY = clientY - rect.top;
  
  relativeY = Math.max(0, Math.min(relativeY, rect.height));
  
  let val = (relativeY / rect.height) * 15;
  gaugeValue = Math.max(0, Math.min(15, val));
  
  updateGaugeUI();
}

const COLOR_STOPS = [
  { pos: 0.0,  color: [244, 67, 54] },
  { pos: 0.25, color: [255, 152, 0] },
  { pos: 0.50, color: [117, 240, 57] },
  { pos: 0.75, color: [76, 175, 80] },
  { pos: 1.0,  color: [42, 151, 60] }
];

function getGaugeColor(percent) {
  let lower = COLOR_STOPS[0];
  let upper = COLOR_STOPS[COLOR_STOPS.length - 1];

  for (let i = 0; i < COLOR_STOPS.length - 1; i++) {
    if (percent >= COLOR_STOPS[i].pos && percent <= COLOR_STOPS[i+1].pos) {
      lower = COLOR_STOPS[i];
      upper = COLOR_STOPS[i+1];
      break;
    }
  }

  const range = upper.pos - lower.pos;
  const t = range === 0 ? 0 : (percent - lower.pos) / range;

  const r = Math.round(lower.color[0] + (upper.color[0] - lower.color[0]) * t);
  const g = Math.round(lower.color[1] + (upper.color[1] - lower.color[1]) * t);
  const b = Math.round(lower.color[2] + (upper.color[2] - lower.color[2]) * t);

  return `rgb(${r}, ${g}, ${b})`;
}

function updateGaugeUI(){
  const fill = document.getElementById("gaugeFill");
  const thumb = document.getElementById("gaugeThumb");
  const thumbImg = document.getElementById("gaugeThumbImg");
  
  const percent = (1 - (gaugeValue / 15)) * 100;
  fill.style.height = percent + "%";
  
  const color = getGaugeColor(percent / 100);
  fill.style.backgroundColor = color;
  
  thumb.style.bottom = percent + "%";
  
  let imgIndex = Math.round(gaugeValue);
  imgIndex = Math.max(0, Math.min(15, imgIndex));
  
  thumbImg.src = GAUGE_IMAGES[imgIndex];
}

function submitGauge(){
  if(busy) return;
  busy = true;
  
  ans["gauge"] = Math.round(gaugeValue);
  
  fadeOut(document.getElementById("gaugeScreen"), () => {
    cur++;
    if(cur >= Qs.length){

    } else if (Qs[cur].id === "location") {
      initLocationScreen();
      fadeIn(document.getElementById("locationScreen"));
    } else {
      renderQ();
      fadeIn(document.getElementById("quizScreen"));
    }
  });
}

/* ── 「いまどこにいたい？」画面のロジック ── */
let isLocationInitialized = false;
let locHasMoved = false;
let locIsOutside = false;
let locMapX = 0;
let locMapY = 0;
let locZoom = 1;
let locPointers = new Map();
let locPanStart = null;
let locPinchStart = null;
let locPersonDrag = null;
let locIsPanning = false;
let locPanMovedDistance = 0;

function initLocationScreen() {
  busy = false;
  locHasMoved = false;
  locIsOutside = false;
  
  document.getElementById("locationPbar").style.width = (2/Qs.length*100) + "%";
  
  const personIcon = document.getElementById('personIcon');
  const mapViewport = document.getElementById('mapViewport');
  const mapContainer = document.getElementById('mapContainer');
  const nextBtn = document.getElementById('locationNextBtn');
  const notHereBtn = document.getElementById('notHereBtn');

  // ボタンは常に有効にする
  nextBtn.disabled = false;
  notHereBtn.classList.remove('selected');
  
  personIcon.style.transform = 'none';
  
  if (!isLocationInitialized) {
    isLocationInitialized = true;
    
    const viewportPoint = (e) => {
      const rect = mapViewport.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    };

    const updateMapTransform = () => {
      mapContainer.style.transform = `translate(${locMapX}px, ${locMapY}px) scale(${locZoom})`;
    };

    const fitMap = () => {
      const vw = mapViewport.clientWidth;
      const vh = mapViewport.clientHeight;
      const mw = mapContainer.offsetWidth;
      const mh = mapContainer.offsetHeight;
      
      if(vw === 0 || vh === 0) return;

      const scaleX = vw / mw;
      const scaleY = vh / mh;
      locZoom = Math.min(scaleX, scaleY);
      
      locMapX = (vw - mw * locZoom) / 2;
      locMapY = (vh - mh * locZoom) / 2;
      
      updateMapTransform();
      
      if (!locHasMoved) {
        const centerLeft = mw / 2 - personIcon.offsetWidth / 2;
        const centerTop = mh / 2 - personIcon.offsetHeight / 2;
        personIcon.style.left = centerLeft + 'px';
        personIcon.style.top = centerTop + 'px';
      }
    };

    const zoomAt = (nextZoom, anchorX, anchorY) => {
      nextZoom = Math.max(0.5, Math.min(2.5, nextZoom));
      if (nextZoom === locZoom) return;
      const contentX = (anchorX - locMapX) / locZoom;
      const contentY = (anchorY - locMapY) / locZoom;
      locZoom = nextZoom;
      locMapX = anchorX - contentX * locZoom;
      locMapY = anchorY - contentY * locZoom;
      updateMapTransform();
    };

    const clampMapPosition = (x, y) => {
      const vw = mapViewport.clientWidth;
      const vh = mapViewport.clientHeight;
      const mw = mapContainer.offsetWidth * locZoom;
      const mh = mapContainer.offsetHeight * locZoom;
      const padding = 50; 
      
      let minX, maxX, minY, maxY;
      
      if (mw > vw) {
        minX = vw - mw - padding;
        maxX = padding;
      } else {
        minX = (vw - mw) / 2 - padding;
        maxX = (vw - mw) / 2 + padding;
      }
      
      if (mh > vh) {
        minY = vh - mh - padding;
        maxY = padding;
      } else {
        minY = (vh - mh) / 2 - padding;
        maxY = (vh - mh) / 2 + padding;
      }
      
      return {
        x: Math.max(minX, Math.min(maxX, x)),
        y: Math.max(minY, Math.min(maxY, y))
      };
    };

    mapViewport.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.draggable-person')) return;
      e.preventDefault();
      mapViewport.setPointerCapture(e.pointerId);
      locPointers.set(e.pointerId, viewportPoint(e));

      if (locPointers.size === 1) {
        const p = locPointers.get(e.pointerId);
        locPanStart = { x: p.x, y: p.y, mapX: locMapX, mapY: locMapY };
        locPinchStart = null;
        locIsPanning = true;
        locPanMovedDistance = 0;
      } else if (locPointers.size === 2) {
        const pts = [...locPointers.values()];
        const dx = pts[1].x - pts[0].x;
        const dy = pts[1].y - pts[0].y;
        locPinchStart = {
          distance: Math.hypot(dx, dy),
          zoom: locZoom,
          centerX: (pts[0].x + pts[1].x) / 2,
          centerY: (pts[0].y + pts[1].y) / 2
        };
        locPanStart = null;
        locIsPanning = false;
      }
    });

    mapViewport.addEventListener('pointermove', (e) => {
      if (!locPointers.has(e.pointerId)) return;
      locPointers.set(e.pointerId, viewportPoint(e));

      if (locPointers.size >= 2 && locPinchStart) {
        const pts = [...locPointers.values()];
        const dx = pts[1].x - pts[0].x;
        const dy = pts[1].y - pts[0].y;
        const distance = Math.hypot(dx, dy);
        const centerX = (pts[0].x + pts[1].x) / 2;
        const centerY = (pts[0].y + pts[1].y) / 2;
        
        const nextZoom = Math.max(0.5, Math.min(2.5,
          locPinchStart.zoom * distance / Math.max(1, locPinchStart.distance)));
        const contentX = (locPinchStart.centerX - locMapX) / locZoom;
        const contentY = (locPinchStart.centerY - locMapY) / locZoom;
        locZoom = nextZoom;
        
        const newMapX = centerX - contentX * locZoom;
        const newMapY = centerY - contentY * locZoom;
        const clamped = clampMapPosition(newMapX, newMapY);
        
        locMapX = clamped.x;
        locMapY = clamped.y;
        updateMapTransform();
      } else if (locPointers.size === 1 && locPanStart) {
        const p = locPointers.get(e.pointerId);
        const dx = p.x - locPanStart.x;
        const dy = p.y - locPanStart.y;
        
        if (locIsPanning) {
          locPanMovedDistance = Math.hypot(dx, dy);
        }
        
        const newMapX = locPanStart.mapX + dx;
        const newMapY = locPanStart.mapY + dy;
        const clamped = clampMapPosition(newMapX, newMapY);
        
        locMapX = clamped.x;
        locMapY = clamped.y;
        updateMapTransform();
      }
    });

    const finishViewportPointer = (e) => {
      const wasSinglePointer = locPointers.size === 1;
      locPointers.delete(e.pointerId);
      
      if (locPointers.size === 1) {
        const [id, p] = [...locPointers.entries()][0];
        locPanStart = { x: p.x, y: p.y, mapX: locMapX, mapY: locMapY };
        locPinchStart = null;
      } else if (locPointers.size === 0) {
        locPanStart = null;
        locPinchStart = null;
        
        if (wasSinglePointer && locIsPanning && locPanMovedDistance < 10) {
          const rect = mapViewport.getBoundingClientRect();
          const viewX = e.clientX - rect.left;
          const viewY = e.clientY - rect.top;
          
          const mapLocalX = (viewX - locMapX) / locZoom;
          const mapLocalY = (viewY - locMapY) / locZoom;
          
          const offsetX = personIcon.offsetWidth / 2;
          const offsetY = personIcon.offsetHeight / 2;
          
          personIcon.classList.remove('dragging');
          personIcon.style.left = (mapLocalX - offsetX) + 'px';
          personIcon.style.top = (mapLocalY - offsetY) + 'px';
          
          locHasMoved = true;
          
          if (locIsOutside) {
            locIsOutside = false;
            notHereBtn.classList.remove('selected');
          }
        }
        locIsPanning = false;
        locPanMovedDistance = 0;
      }
    };
    
    mapViewport.addEventListener('pointerup', finishViewportPointer);
    mapViewport.addEventListener('pointercancel', finishViewportPointer);

    mapViewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const p = viewportPoint(e);
      zoomAt(locZoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1), p.x, p.y);
    }, { passive: false });

    personIcon.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      personIcon.setPointerCapture(e.pointerId);
      personIcon.classList.add('dragging');
      
      const p = viewportPoint(e);
      const mapLocalX = (p.x - locMapX) / locZoom;
      const mapLocalY = (p.y - locMapY) / locZoom;
      
      const iconRect = personIcon.getBoundingClientRect();
      const mapRect = mapContainer.getBoundingClientRect();
      
      const currentLeft = (iconRect.left - mapRect.left) / locZoom;
      const currentTop = (iconRect.top - mapRect.top) / locZoom;
      
      locPersonDrag = { pointerId: e.pointerId, offsetX: mapLocalX - currentLeft, offsetY: mapLocalY - currentTop };
      
      personIcon.style.left = currentLeft + 'px';
      personIcon.style.top = currentTop + 'px';
      personIcon.style.cursor = 'grabbing';
    });

    personIcon.addEventListener('pointermove', (e) => {
      if (!locPersonDrag || locPersonDrag.pointerId !== e.pointerId) return;
      e.preventDefault();
      const p = viewportPoint(e);
      
      let left = (p.x - locMapX) / locZoom - locPersonDrag.offsetX;
      let top = (p.y - locMapY) / locZoom - locPersonDrag.offsetY;
      
      left = Math.max(0, Math.min(left, mapContainer.offsetWidth - personIcon.offsetWidth));
      top = Math.max(0, Math.min(top, mapContainer.offsetHeight - personIcon.offsetHeight));
      
      personIcon.style.left = left + 'px';
      personIcon.style.top = top + 'px';

      if (!locHasMoved) {
        locHasMoved = true;
      }
      if (locIsOutside) {
        locIsOutside = false;
        notHereBtn.classList.remove('selected');
      }
    });

    const finishPersonDrag = (e) => {
      if (locPersonDrag && locPersonDrag.pointerId === e.pointerId) {
        locPersonDrag = null;
        personIcon.classList.remove('dragging');
        personIcon.style.cursor = 'grab';
      }
    };
    personIcon.addEventListener('pointerup', finishPersonDrag);
    personIcon.addEventListener('pointercancel', finishPersonDrag);

    notHereBtn.addEventListener('click', () => {
      if (busy) return;
      locIsOutside = true;
      locHasMoved = true;
      notHereBtn.classList.add('selected');
      submitLocation();
    });

    window.addEventListener('resize', fitMap);
    
    // 初期位置を即時設定
    const vw = mapViewport.clientWidth;
    const vh = mapViewport.clientHeight;
    const mw = mapContainer.offsetWidth;
    const mh = mapContainer.offsetHeight;
    if(vw > 0 && vh > 0) {
      locZoom = Math.min(vw / mw, vh / mh);
      locMapX = (vw - mw * locZoom) / 2;
      locMapY = (vh - mh * locZoom) / 2;
      mapContainer.style.transform = `translate(${locMapX}px, ${locMapY}px) scale(${locZoom})`;
      
      const centerLeft = mw / 2 - personIcon.offsetWidth / 2;
      const centerTop = mh / 2 - personIcon.offsetHeight / 2;
      personIcon.style.left = centerLeft + 'px';
      personIcon.style.top = centerTop + 'px';
    }
    
    requestAnimationFrame(() => {
      requestAnimationFrame(fitMap);
    });
  } else {
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        const vw = mapViewport.clientWidth;
        const vh = mapViewport.clientHeight;
        const mw = mapContainer.offsetWidth;
        const mh = mapContainer.offsetHeight;
        
        if(vw === 0 || vh === 0) return;
        
        locZoom = Math.min(vw / mw, vh / mh);
        locMapX = (vw - mw * locZoom) / 2;
        locMapY = (vh - mh * locZoom) / 2;
        mapContainer.style.transform = `translate(${locMapX}px, ${locMapY}px) scale(${locZoom})`;
        
        const centerLeft = mw / 2 - personIcon.offsetWidth / 2;
        const centerTop = mh / 2 - personIcon.offsetHeight / 2;
        personIcon.style.left = centerLeft + 'px';
        personIcon.style.top = centerTop + 'px';
        
        locHasMoved = false;
      });
    });
  }
}

const ANS_LABEL = {
  mood:   { happy:"たのしい", sad:"かなしい", angry:"もやもや", anxious:"しんぱい", normal:"ふつう" },
  body:   { heart:"どきどきしてる", breath:"いきぐるしい", bad:"たいちょうがわるい", fine:"からだはへいき", normal:"からだはふつう" },
  wish:   { sleep:"ねむりたい", play:"あそびたい", talk:"はなしたいことがある", nothing:"したいことはない" },
};

const ENERGY_ORDER = ["high","mid","low","verylow"];
function derivePhysicalLevel(energy, body, gaugeVal){
  const baseIdx = ENERGY_ORDER.indexOf(energy);
  let idx = baseIdx === -1 ? 1 : baseIdx;
  
  const BODY_WEIGHT = { fine:0, normal:0, heart:1, breath:1, bad:2 };
  const weight = BODY_WEIGHT[body] ?? 0;
  idx += weight;
  
  if(gaugeVal !== undefined){
    if(gaugeVal >= 12) idx += 2;
    else if(gaugeVal >= 7) idx += 1;
  }
  
  idx = Math.min(ENERGY_ORDER.length - 1, idx);
  return ENERGY_ORDER[idx];
}

function showResult(){
  const mt = ans.mood || "happy";
  
  let derivedEnergy = "mid";
  if (ans.gauge !== undefined) {
    if (ans.gauge <= 3) derivedEnergy = "high";
    else if (ans.gauge <= 8) derivedEnergy = "mid";
    else if (ans.gauge <= 12) derivedEnergy = "low";
    else derivedEnergy = "verylow";
  }
  
  const physicalLevel = derivePhysicalLevel(derivedEnergy, ans.body || "fine", ans.gauge);
  const key = mt + "_" + physicalLevel;
  let d = MD[key];
  if(!d){
    console.error(
      `[きもちチェック] MDに未定義の組み合わせです: mood="${mt}", physicalLevel="${physicalLevel}" (key="${key}")。` +

  const subTagsEl = document.getElementById("subTags");

      nameId: histUser.id,

    });
    localStorage.setItem(HIST_KEY, JSON.stringify(hist));
  }
  const resUser = getSelectedUser();

let bubbleHintTimer = null;

function placeBubbles(list){
  const scene=document.getElementById("bscene");
  scene.querySelectorAll(".bubble").forEach(b=>b.remove());
  stopBubbleHint();

  const INTERVAL = cssVar('--bubble-feed-ms') || 1200;
  const slots = list.map((_,i)=>i);
  for(let k=slots.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[slots[k],slots[j]]=[slots[j],slots[k]];}

  list.forEach((item,i)=>{
    const el=document.createElement("div");
    el.className="bubble";
    const bc = item.g && BC[item.g] ? BC[item.g] : {c:item.c||"#FBEAF0", tc:item.tc||"#72243E"};
    const imgSrc = item.img ? BASE_ACT + item.img : BASE_ACT + "404.png";
    const imgHtml = `<img class="bubble-img" src="${imgSrc}" alt="">`;
    el.innerHTML = imgHtml + `<span class="bubble-txt">${item.t}</span>`;
    el.style.cssText=`background:${bc.c};color:${bc.tc};cursor:pointer;`;
    el.onclick = () => openDetail(item);
    scene.appendChild(el);
    const delay = (slots[i] / list.length) * INTERVAL + Math.random() * 30;
    setTimeout(()=>{ requestAnimationFrame(()=>requestAnimationFrame(()=>{ el.style.opacity="1"; })); }, delay);
  });

  setTimeout(startBubbleHint, INTERVAL + 300);
}

function startBubbleHint(){
  stopBubbleHint();
  bubbleHintTimer = setInterval(()=>{
    const bubbles = document.querySelectorAll("#bscene .bubble");
    if(bubbles.length === 0) return;
    const idle = Array.from(bubbles).filter(b=>!b.classList.contains("hint-pulse"));
    const target = (idle.length ? idle : bubbles)[Math.floor(Math.random()*(idle.length ? idle.length : bubbles.length))];
    target.classList.add("hint-pulse");
    target.addEventListener("animationend", ()=>target.classList.remove("hint-pulse"), {once:true});
  }, 5200);
}

function stopBubbleHint(){
  if(bubbleHintTimer){ clearInterval(bubbleHintTimer); bubbleHintTimer = null; }
}

let currentDetailItem = null;

function openDetail(item){
  stopBubbleHint();
  currentDetailItem = item;
  const img = BASE_ACT + (item.img || "404.png");
  const di = document.getElementById("detailImg");
  di.src = img;
  di.style.display = "block";
  document.getElementById("detailTtl").textContent  = item.t;
  document.getElementById("detailDesc").textContent = item.desc || "";
  const bc = item.g && BC[item.g] ? BC[item.g] : {c:"#FBEAF0", tc:"#72243E"};
  const card = document.getElementById("detailCard");
  card.style.setProperty("--detail-bg", bc.c);
  card.style.setProperty("--detail-tc", bc.tc);
  const liked = likedSet.has(item.t);
  const likeBtn = document.getElementById("likeBtn");
  const likeImg = document.getElementById("likeImg");
  likeImg.src = liked ? LIKE_IMG_ON : LIKE_IMG_OFF;
  if(liked){ likeBtn.classList.add("liked"); }else{ likeBtn.classList.remove("liked"); }
  likeBtn.disabled = liked;
  fadeOut(document.getElementById("actScreen"),()=>{
    fadeIn(document.getElementById("detailScreen"));
  });
}

function toggleLike(){
  if(!currentDetailItem) return;
  const t = currentDetailItem.t;
  if(likedSet.has(t)) return;

  likedSet.add(t);
  const likeBtn = document.getElementById("likeBtn");
  const likeImg = document.getElementById("likeImg");
  likeImg.src = LIKE_IMG_ON;
  likeBtn.classList.add("liked");
  likeBtn.disabled = true;

  const likeUser = getSelectedUser();
  if(likeUser && currentDetailItem){
    const LIKES_KEY = "kimochi_likes";
    let likes = {};
    try{ likes = JSON.parse(localStorage.getItem(LIKES_KEY)||"{}"); }catch(e){}
    if(!likes[likeUser.id]) likes[likeUser.id] = [];
    const already = likes[likeUser.id].some(x => x.title === currentDetailItem.t);
    if(!already){
      likes[likeUser.id].push({
        title: currentDetailItem.t,
        genre: currentDetailItem.g  || "",
        img:   currentDetailItem.img|| "",
        desc:  currentDetailItem.desc|| ""
      });
      localStorage.setItem(LIKES_KEY, JSON.stringify(likes));
    }
  }

  const url = LIKE_FORM_URL + "?title=" + encodeURIComponent(t);

  if(navigator.sendBeacon){
    navigator.sendBeacon(url);
  }
  else if(window.fetch){
    fetch(url, {mode:"no-cors"}).catch(()=>{});
  }
  else {
    new Image().src = url;
  }
}

function closeDetail(){
  fadeOut(document.getElementById("detailScreen"),()=>{
    document.getElementById("detailScreen").style.background="";
    fadeIn(document.getElementById("actScreen"));
    startBubbleHint();
  });
}

function restart(){
  stopBubbleHint();
  busy = false;
  document.getElementById("bscene").querySelectorAll(".bubble").forEach(b=>b.remove());
  document.getElementById("rttl").textContent="";
  document.getElementById("cce").innerHTML="";
  document.getElementById("cct").textContent="";
  document.getElementById("subTags").textContent="";
  if(document.getElementById("actTtl")) document.getElementById("actTtl").textContent="";
  if(document.getElementById("actDesc")) document.getElementById("actDesc").textContent="";
  const rnl=document.getElementById("resultNameLabel"); if(rnl) rnl.style.display="none";
  const anl=document.getElementById("actNameLabel"); if(anl) anl.style.display="none";
  chosenBubbles=[];
  likedSet.clear();
  const current =
    document.getElementById("detailScreen").classList.contains("active")
      ? document.getElementById("detailScreen")
      : document.getElementById("actScreen").classList.contains("active")
        ? document.getElementById("actScreen")
        : document.getElementById("resultScreen");
  document.getElementById("detailScreen").style.background="";
  fadeOut(current,()=>{ cur=0;ans={}; fadeIn(document.getElementById("startScreen")); });
}
</script>
</body>
